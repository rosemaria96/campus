<!DOCTYPE html>
<html lang="en">
<head>
    <title>Campus Maintenance</title>
    {% load static %}
    <link rel ="stylesheet" href="{% static 'style.css' %}">
</head>
<body>

<h2>Campus</h2>
<nav>
    <a href = "{% url 'home' %}">Home</a>
    <a href = "{% url 'submit_request' %}">Submit</a>
    <a href = "{% url 'my_requests' %}">MY Request</a>

    {% if user.is_authenticated %}
        <a href ="{% url 'logout' %}">Logout</a>
    {% else %}
        <a href ="{% url 'login' %}">Login</a>
        <a href = "{% url 'register' %}">Register</a>
    {% endif %}

    {% if user.is_staff %}
        <a href ="{% url 'staff_requests' %}">Staff Page</a>

    {% endif %}
</nav>

<hr>

{% block content %}
{% endblock %}

    
</body>
</html>
